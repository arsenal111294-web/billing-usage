<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет подключения</title>
    <style>
      :root { color-scheme: light dark; --bg: #f6f6f4; --ink: #0b0b0b; --muted: #52514e; --accent: #2a78d6; }
      @media (prefers-color-scheme: dark) { :root { --bg: #0d0d0d; --ink: #ffffff; --muted: #c3c2b7; --accent: #3987e5; } }
      body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--ink);
             font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; padding: 24px; }
      p { color: var(--muted); max-width: 320px; line-height: 1.5; }
      button { margin-top: 16px; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; background: var(--accent); color: #fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Нет подключения</h1>
      <p>Billing Tracker не может открыть данные без интернета. Напоминания о списаниях всё равно придут — они уже запланированы на телефоне.</p>
      <button onclick="location.href='https://billing-tracker-demo.netlify.app'">Повторить</button>
    </main>
  </body>
</html>
